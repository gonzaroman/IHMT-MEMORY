# Packaging for PyPI: `uvx ihmt-memory` runs the MCP server without cloning the repository.
# The clone-and-venv install in README.md does not use this file and keeps working unchanged.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ihmt-memory"
# Keep equal to the version in mcp_server.py and server.json (tests/test_packaging.py checks it).
version = "1.4.0"
description = "Long-term memory for AI coding agents as a tree of plain local files, served over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gonzalo Román Márquez" }]
keywords = ["mcp", "memory", "claude", "llm", "agents", "long-term-memory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
]
dependencies = ["mcp[cli]>=2.0"]

[project.urls]
Homepage = "https://github.com/gonzaroman/IHMT-MEMORY"
Issues = "https://github.com/gonzaroman/IHMT-MEMORY/issues"

[project.scripts]
ihmt-memory = "ihmt_launcher:main"

[tool.hatch.build.targets.wheel]
only-include = ["ihmt", "mcp_server.py", "ihmt_launcher.py"]

[tool.hatch.build.targets.wheel.force-include]
"templates/memory-instructions.md" = "ihmt/templates/memory-instructions.md"

[tool.hatch.build.targets.sdist]
only-include = [
    "ihmt", "mcp_server.py", "ihmt_launcher.py", "templates/memory-instructions.md",
    "README.md", "LICENSE", "requirements-mcp.txt", "server.json",
]
